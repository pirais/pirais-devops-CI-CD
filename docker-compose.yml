services:
  api:
    build:
      context: .
      args:
        APP_VERSION: local
    image: node-cicd-showcase:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      APP_ENV: local
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
